<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Calcular IMC</h2>
      <input type="number" id="edit_text_altura" placeholder="Altura em cm" />
      <input type="number" id="edit_text_peso" placeholder="Peso em kg" />
      <button id="button_calculate">Calcular</button>
      <button id="button_clear">Limpar</button>
      <div id="text_view_result"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
